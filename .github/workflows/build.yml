name: Build RavenXD Launcher

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check compiler
        run: |
          cl
          cmake --version
          ninja --version

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Prepare package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package

          Copy-Item `
            "build\RavenXDLauncher.exe" `
            "package\RavenXDLauncher.exe"

          if (Test-Path "launcher") {
            Copy-Item "launcher" "package\launcher" -Recurse
          }

          if (Test-Path "mod") {
            Copy-Item "mod" "package\mod" -Recurse
          }

          if (Test-Path "assets") {
            Copy-Item "assets" "package\assets" -Recurse
          }

          if (Test-Path "README.md") {
            Copy-Item "README.md" "package\README.md"
          }

      - name: Create ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path "package\*" `
            -DestinationPath "RavenXD-Launcher-Windows-x64.zip" `
            -Force

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RavenXD-Launcher-Windows-x64
          path: package

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RavenXD-Launcher-ZIP
          path: RavenXD-Launcher-Windows-x64.zip
